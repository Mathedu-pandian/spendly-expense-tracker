{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Edit Expense</h1>
            <p class="auth-subtitle">Update amount, category, date, or note for this transaction</p>
        </div>

        {% if error %}
        <div class="auth-error">
            <span>⚠️ {{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}" class="auth-form">
            <!-- Amount Field -->
            <div class="form-group">
                <label for="amount" class="form-label">Amount (₹)</label>
                <div class="currency-input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                           value="{{ '%.2f'|format(expense.amount) }}" required autofocus class="form-input currency-input">
                </div>
            </div>

            <!-- Category Field -->
            <div class="form-group">
                <label for="category" class="form-label">Category</label>
                <select id="category" name="category" class="form-select" required>
                    <option value="Food" {% if expense.category == 'Food' %}selected{% endif %}>🍔 Food & Groceries</option>
                    <option value="Bills" {% if expense.category == 'Bills' %}selected{% endif %}>⚡ Bills & Utilities</option>
                    <option value="Transport" {% if expense.category == 'Transport' %}selected{% endif %}>🚗 Transport & Fuel</option>
                    <option value="Health" {% if expense.category == 'Health' %}selected{% endif %}>💊 Health & Medical</option>
                    <option value="Shopping" {% if expense.category == 'Shopping' %}selected{% endif %}>🛍️ Shopping & Apparel</option>
                    <option value="Entertainment" {% if expense.category == 'Entertainment' %}selected{% endif %}>🎬 Entertainment & Leisure</option>
                    <option value="Other" {% if expense.category == 'Other' %}selected{% endif %}>📦 Other Miscellaneous</option>
                </select>
            </div>

            <!-- Date Field -->
            <div class="form-group">
                <label for="date" class="form-label">Transaction Date</label>
                <input type="date" id="date" name="date" value="{{ expense.date }}" required class="form-input">
            </div>

            <!-- Description Note Field -->
            <div class="form-group">
                <label for="description" class="form-label">Description / Merchant (Optional)</label>
                <input type="text" id="description" name="description" value="{{ expense.description or '' }}" placeholder="e.g. Supermarket Groceries" class="form-input">
            </div>

            <!-- Form Actions -->
            <div class="form-actions-row">
                <a href="{{ url_for('dashboard') }}" class="btn-ghost">Cancel</a>
                <button type="submit" class="btn-primary">Update Transaction</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
