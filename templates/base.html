<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spendly{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('spendly-theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="{{ url_for('landing') }}" class="nav-brand">
                <span class="brand-icon">◈</span>
                <span class="brand-name">Spendly</span>
            </a>
            <div class="nav-links">
                <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Dark / Light Mode">
                    <span id="theme-toggle-icon">🌙</span>
                </button>

                {% if g.user %}
                    <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.path == url_for('dashboard') %}active-nav{% endif %}">Dashboard</a>
                    <a href="{{ url_for('budgets') }}" class="nav-item {% if request.path == url_for('budgets') %}active-nav{% endif %}">Budgets</a>
                    <a href="{{ url_for('profile') }}" class="nav-user {% if request.path == url_for('profile') %}active-nav{% endif %}">
                        <span class="user-avatar">{{ g.user.name[0] | upper }}</span>
                        <span class="user-name">{{ g.user.name }}</span>
                    </a>
                    <a href="{{ url_for('logout') }}" class="nav-logout">Sign out</a>
                {% else %}
                    <a href="{{ url_for('login') }}">Sign in</a>
                    <a href="{{ url_for('register') }}" class="nav-cta">Get started</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span class="brand-icon">◈</span>
            <span class="footer-name">Spendly</span>
            <p class="footer-copy">Track every rupee. Own your finances.</p>
            <div class="footer-legal">
                <a href="{{ url_for('terms') }}">Terms & Conditions</a>
                <span class="footer-dot">•</span>
                <a href="{{ url_for('privacy') }}">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
