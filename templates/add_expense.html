{% extends "base.html" %}

{% block title %}Log New Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container" style="max-width: 520px;">

        <div class="auth-header">
            <h1 class="auth-title">Log New Expense</h1>
            <p class="auth-subtitle">Add a transaction to track your spending</p>
        </div>

        <div class="auth-card" style="padding: 2.25rem;">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                
                <!-- Amount Field -->
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <div class="currency-input-wrapper">
                        <span class="currency-symbol">₹</span>
                        <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                               class="form-input currency-input" placeholder="0.00"
                               required autofocus>
                    </div>
                </div>

                <!-- Category Field -->
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="Food">🍔 Food & Dining</option>
                        <option value="Bills">💡 Bills & Utilities</option>
                        <option value="Transport">🚌 Transport & Fuel</option>
                        <option value="Health">💊 Health & Medical</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>

                <!-- Date Field -->
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input"
                           value="{{ today_date }}" required>
                </div>

                <!-- Description / Note Field -->
                <div class="form-group">
                    <label for="description">Note / Description (Optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Grocery shopping at BigBasket">
                </div>

                <!-- Form Action Buttons -->
                <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn-primary" style="flex: 1;">Save Expense</button>
                    <a href="{{ url_for('dashboard') }}" class="btn-ghost" style="padding: 0.7rem 1.25rem;">Cancel</a>
                </div>

            </form>
        </div>

    </div>
</section>
{% endblock %}
